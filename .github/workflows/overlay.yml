# The overlay's installers, built where every build happens the same way.
#
# A release `overlay-vX.Y.Z` builds Tesserafy-Setup-X.Y.Z.exe on Windows and
# a .dmg for each Mac chip on macOS, and attaches them to one GitHub Release,
# whose download links are what a pilot is sent. Either way of making one
# works:
#   - on GitHub's website: Releases → Draft a new release → tag
#     overlay-vX.Y.Z, created on publish from main → Publish. The installers
#     are attached a few minutes later; until then the release has none;
#   - from a terminal: push the tag, and the release is created once every
#     platform has built.
# Publishing on the website also creates the tag, so two runs may start for
# it: the later cancels the earlier (it shows as cancelled) and finishes the
# same way. On a pull request that touches the overlay, or run by hand, it
# builds the same installers and keeps them as run artifacts without
# publishing.
#
# Checks that fail the build rather than ship something wrong:
#   - the tag must match apps/desktop/package.json's version, or the file
#     names and the app's own idea of its version disagree;
#   - the Electron fuses must read hardened, on every platform. A config change
#     that silently dropped them would ship an app any local program can run
#     as Node;
#   - on macOS, the app's signature must verify. The build edits the Electron
#     binary, and a Mac app whose signature no longer matches is "damaged"
#     rather than merely unsigned — it cannot be opened at all.
#
# Installers are attached only after every platform has built and passed,
# so a release never has one platform's installer without the other's.
#
# Unsigned: Windows SmartScreen shows "unknown publisher" and macOS Gatekeeper
# refuses the first open, until signing is configured in
# apps/desktop/electron-builder.yml. The release notes say what to do.

name: Overlay installer

on:
  push:
    tags: ['overlay-v*']
  # A release published on the website, which creates its tag as it goes.
  release:
    types: [published]
  # Any change to the overlay or to this file builds the installers too, so a
  # packaging break is found in review rather than on release day. Nothing is
  # published from a pull request.
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/scoring/**'
      - '.github/workflows/overlay.yml'
  workflow_dispatch:

permissions:
  contents: read

# One run at a time for a tag or a pull request: a release published on the
# website starts one for the release and one for the tag it creates.
concurrency:
  group: overlay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build the Windows installer
    # Other releases the repository might publish are not the overlay's.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'overlay-v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @tesserafy/desktop dist:win

      - name: The fuses are hardened
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          fuses=$(npx --yes @electron/fuses@1.8.0 read --app "$GITHUB_WORKSPACE/apps/desktop/release/win-unpacked/Tesserafy.exe")
          echo "$fuses"
          for expected in "RunAsNode is Disabled" \
                          "EnableNodeOptionsEnvironmentVariable is Disabled" \
                          "EnableNodeCliInspectArguments is Disabled" \
                          "EnableEmbeddedAsarIntegrityValidation is Enabled" \
                          "OnlyLoadAppFromAsar is Enabled"; do
            echo "$fuses" | grep -q "$expected" || { echo "::error::expected '$expected'"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: overlay-windows
          path: apps/desktop/release/Tesserafy-Setup-*.exe
          if-no-files-found: error

  mac:
    name: Build the macOS installers
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'overlay-v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # No signing identity is looked for: the config signs ad hoc, and a
      # runner that happened to hold a certificate should not change that.
      #
      # Signed on pull requests too. electron-builder skips all signing on a
      # PR by default — the ad-hoc signature included — which builds exactly
      # the "damaged" app the check below exists to refuse; and a PR's build
      # is what gets tested before a release.
      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_FOR_PULL_REQUEST: 'true'
        run: |
          pnpm --filter @tesserafy/desktop build
          pnpm --filter @tesserafy/desktop exec electron-builder --mac --publish never

      - name: The fuses are hardened, and the signature verifies
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          apps=("$GITHUB_WORKSPACE"/apps/desktop/release/mac*/Tesserafy.app)
          [ "${#apps[@]}" -eq 2 ] && [ -d "${apps[0]}" ] || { echo "::error::expected two apps, found: ${apps[*]}"; exit 1; }
          for app in "${apps[@]}"; do
            echo "== $app"
            fuses=$(npx --yes @electron/fuses@1.8.0 read --app "$app")
            echo "$fuses"
            for expected in "RunAsNode is Disabled" \
                            "EnableNodeOptionsEnvironmentVariable is Disabled" \
                            "EnableNodeCliInspectArguments is Disabled" \
                            "EnableEmbeddedAsarIntegrityValidation is Enabled" \
                            "OnlyLoadAppFromAsar is Enabled"; do
              echo "$fuses" | grep -q "$expected" || { echo "::error::$app: expected '$expected'"; exit 1; }
            done
            codesign --verify --deep --strict --verbose=2 "$app" || { echo "::error::$app: signature does not verify"; exit 1; }
            /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist"
            lipo -archs "$app/Contents/MacOS/Tesserafy"
            # Call detection's helper: in the app, both chips, and it answers.
            # A runner is a Mac on 14.2 or later, so it must say it can read the record.
            helper="$app/Contents/MacOS/mic-users"
            lipo -archs "$helper" | grep -q "x86_64 arm64\|arm64 x86_64" || { echo "::error::$app: mic-users is not universal"; exit 1; }
            answer=$("$helper")
            echo "mic-users: $answer"
            echo "$answer" | grep -q '"supported":true' || { echo "::error::$app: mic-users did not read the record"; exit 1; }
          done
          ls -la "$GITHUB_WORKSPACE"/apps/desktop/release/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: overlay-mac
          path: apps/desktop/release/Tesserafy-*-mac-*.dmg
          if-no-files-found: error

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/overlay-v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: The tag matches the app's version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          tag="${GITHUB_REF_NAME#overlay-v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} but apps/desktop/package.json says ${version}"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la installers
          version="${GITHUB_REF_NAME#overlay-v}"
          notes="The Tesserafy live scorecard overlay. Sign in with your usual Tesserafy username or email and password.

          Windows: download Tesserafy-Setup-${version}.exe. It is not yet code-signed, so Windows SmartScreen will say it is from an unknown publisher: choose More info, then Run anyway.

          Mac: download the -mac-arm64.dmg for Apple silicon (M1 and later; Apple menu → About This Mac says Chip) or the -mac-x64.dmg for Intel. Open it and drag Tesserafy to Applications. It is not yet notarised by Apple, so the first open is refused: go to System Settings → Privacy & Security, scroll to Security, choose Open Anyway, then open it again. macOS asks once for the microphone, and may ask once to use the keychain, where the sign-in is kept — choose Always Allow.

          Not for customer calls until the screen-share check (S1 in docs/engineering/qa-checklist.md) has passed in Zoom, Meet and Teams, on each platform."
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Published on the website: the installers go onto it, and it gets
            # the notes above only if it was published without any of its own.
            gh release upload "$GITHUB_REF_NAME" installers/* --clobber
            if [ -z "$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)" ]; then
              gh release edit "$GITHUB_REF_NAME" --title "Tesserafy overlay ${version}" --notes "$notes"
            fi
          else
            gh release create "$GITHUB_REF_NAME" installers/* --title "Tesserafy overlay ${version}" --notes "$notes"
          fi
