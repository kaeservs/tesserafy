# P1, in a browser, on a schedule.
#
# Deliberately not on pull requests. It drives a real deployment holding real
# customer transcripts, and a check that signs into production on every PR is
# a check that will eventually run from a fork. It runs daily and on demand,
# which matches what it is actually watching: not "did this diff break the
# page" — unit tests and typecheck cover that — but "is the evidence chain
# still intact in the thing people are using".
#
# Needs E2E_BASE_URL, E2E_USERNAME and E2E_PASSWORD in Actions secrets. Until
# they are set every run fails, which is the right behaviour for a check that
# cannot see what it is meant to be checking.

name: P1 evidence chain

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: Every quote verbatim in its segment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: pnpm e2e
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          # Optional. Set it and the operator console's door is checked too:
          # that an anonymous visitor is turned away, that a real customer with
          # a correct password is refused and keeps no session, and that the
          # login page says nothing about what is behind it. Unset, those tests
          # skip rather than fail, because a suite that goes red when an
          # optional app is not deployed teaches people to ignore it.
          ADMIN_BASE_URL: ${{ secrets.ADMIN_BASE_URL }}
        run: pnpm e2e

      # No artifacts. A trace of a signed-in session holds the session's
      # cookies and meeting content, and this repository is public, so anyone
      # can download what a run uploads (security review, 2026-10-12). A
      # failure is reproduced locally with `pnpm e2e`, where the trace stays.
