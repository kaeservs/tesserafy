# The overlay's installers: Windows (NSIS) and macOS (a .dmg per chip).
#
# Only what the installed app runs is packaged: the compiled main and preload,
# and the renderer, which esbuild has already bundled with @tesserafy/scoring.
# The app has no runtime dependencies to install — which is why scoring sits
# in devDependencies, and why packaging does not have to untangle pnpm's
# workspace links.
#
# Unsigned. Windows SmartScreen will say "unknown publisher" until a code
# signing certificate is bought and configured here (win.azureSignOptions or
# a certificate file); nothing else about the installer depends on it.
appId: com.tesserafy.overlay
productName: Tesserafy
copyright: Tesserafy
directories:
  output: release
files:
  - dist/**
  - package.json
asar: true

# Electron's defaults are for development. A shipped overlay holds a signed-in
# session and runs on customers' machines, so the switches that let anything
# else drive it are turned off: running the exe as plain Node, NODE_OPTIONS,
# and the inspector flags (any of which would let another program on the
# machine run code as this app, with its session). The packaged code is
# checked against its hash at start, and nothing outside the package loads.
#
# One is left on, deliberately: extra privileges for file://. The overlay's
# page is a module script loaded from disk, and Chromium blocks module scripts
# from file:// without them. It widens only what our own page may do.
#
# The inspector switch is also what automated tests attach through, so the
# shipped build cannot be driven by Playwright — which is how the check that
# this is on works (see the PR that added it).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  grantFileProtocolExtraPrivileges: true
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Tesserafy-Setup-${version}.${ext}
nsis:
  # A normal per-user install: no administrator prompt, choosable folder,
  # Start-menu entry, and an uninstaller that removes the saved sign-in too.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Tesserafy
  deleteAppDataOnUninstall: true

# macOS: one .dmg for Apple silicon and one for Intel, each half the size of a
# universal build that every Mac would download both halves of.
#
# Not signed by Apple and not notarised, so Gatekeeper refuses the first open
# and the user allows it once under System Settings → Privacy & Security. It
# is signed ad hoc ("-"), and that part is not optional: flipping the fuses and
# packing the asar edit the Electron binary, which breaks the signature it
# shipped with, and macOS calls an app with a broken signature "damaged" —
# with no Open Anyway. The workflow checks the signature verifies.
#
# Notarising needs an Apple Developer ID ($99 a year), identity set to it, the
# hardened runtime on, and an entitlements file that allows audio input (and
# the JIT Electron needs). The hardened runtime is off until then because an
# ad-hoc signature cannot carry the entitlements it would demand.
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  artifactName: Tesserafy-${version}-mac-${arch}.${ext}
  category: public.app-category.business
  identity: '-'
  hardenedRuntime: false
  notarize: false
  extendInfo:
    # macOS stops an app that opens the microphone without saying why. This is
    # the sentence in the permission prompt.
    NSMicrophoneUsageDescription: Tesserafy listens to your call, once you start it, to score it live against your criteria.
dmg:
  title: Tesserafy ${version}
