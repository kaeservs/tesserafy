name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Neither job runs the desktop overlay, so neither needs Electron's ~100 MB
# binary — and its postinstall download failing (a 500 from the host, on
# #98) failed the tenant-isolation job over nothing it tests. The overlay's
# own workflow (overlay.yml) still downloads it.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

# Read the code, nothing more: no step here writes to the repository.
permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, unit tests, retrieval guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm guard:retrieval

      # The eval harness grades what ships, so its matching rule is part of
      # what can break. Standard library only — no Python dependencies.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Eval harness unit tests
        run: python -m unittest discover -s tests -t .
        working-directory: services/eval

  tenant-isolation:
    # The P0 gate. Release-blocking: make this a required status check on main.
    name: Tenant isolation (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start Supabase (applies migrations and seed)
        # Only what the tests use: the database, its API (PostgREST behind
        # Kong) and Auth. Every other image is one more pull from a registry
        # that rate-limits CI runners, which failed this job twice running.
        run: pnpm exec supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Export connection details
        # `status -o env` prints KEY="value"; $GITHUB_ENV would keep the quotes
        # as part of the value, so strip them.
        run: |
          pnpm exec supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E '^SUPABASE_(URL|ANON_KEY|SERVICE_ROLE_KEY)=' \
            | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"

      - name: Direct query (pgTAP)
        run: pnpm exec supabase test db

      - name: API and retrieve()
        run: pnpm test:integration
