<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tesserafy</title>
    <style>
      /*
       * The overlay is read out of the corner of an eye during a conversation
       * someone is having. That is the whole design constraint:
       *
       *   - glanceable in under a second, so state is a mark and a weight as
       *     well as a colour;
       *   - quiet, so nothing animates and nothing is brighter than it needs
       *     to be — a scorecard that pulls attention off the customer costs
       *     more than it gives;
       *   - legible over anything, since it floats over whatever is on screen.
       */
      :root { color-scheme: dark; font: 13px/1.5 system-ui, sans-serif; }

      body {
        margin: 0;
        padding: 12px 14px;
        color: #f5f5f4;
        background: rgba(12, 10, 9, 0.88);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(120, 113, 108, 0.35);
        border-radius: 12px;
        -webkit-app-region: drag;
        user-select: none;
      }

      header { display: flex; justify-content: space-between; align-items: baseline; }
      h1 { font-size: 11px; margin: 0; font-weight: 600; letter-spacing: 0.08em;
           text-transform: uppercase; color: #a8a29e; }
      .score { font-size: 28px; font-weight: 700; line-height: 1; }
      .score span { font-size: 11px; font-weight: 400; color: #78716c; }

      ul { list-style: none; margin: 10px 0 0; padding: 0; }
      li { display: flex; justify-content: space-between; align-items: baseline;
           gap: 10px; padding: 5px 0; }
      li + li { border-top: 1px solid rgba(120, 113, 108, 0.18); }
      .label { color: #e7e5e4; }

      /* State is never colour alone: peripheral vision reads shape and weight
         long before it reads hue. */
      .state { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #78716c; }
      .state::before { margin-right: 5px; }
      .state.confirmed { color: #4ade80; font-weight: 700; }
      .state.confirmed::before { content: "●"; }
      .state.candidate { color: #fbbf24; }
      .state.candidate::before { content: "◐"; }
      .state.contradicted { color: #f87171; font-weight: 700; }
      .state.contradicted::before { content: "✕"; }
      .state.unobserved::before { content: "○"; }

      footer { margin-top: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      button { -webkit-app-region: no-drag; font: inherit; font-size: 11px; color: #d6d3d1;
               background: transparent; border: 1px solid rgba(120, 113, 108, 0.35);
               border-radius: 6px; padding: 3px 7px; cursor: pointer; }
      button:hover { border-color: #a8a29e; }
      .muted { color: #78716c; font-size: 10px; }
      /* Pushed to its own end of the footer so it reads as a separate fact
         from the score, which is what it is. */
      .keeping { margin-left: auto; }

      /* Loud on purpose, and only when protection is off: this is the one
         state where the overlay is a liability rather than a tool. */
      .banner { background: #f97316; color: #0c0a09; font-weight: 700; padding: 5px 7px;
                border-radius: 6px; margin-bottom: 10px; font-size: 10px;
                letter-spacing: 0.04em; }
      .banner[hidden] { display: none; }

      .suggestion { margin-top: 10px; padding: 8px 10px; border-radius: 8px;
                    border: 1px solid rgba(165, 180, 252, 0.5);
                    background: rgba(67, 56, 202, 0.18); }
      .suggestion[hidden] { display: none; }
      .suggestion-ask { margin: 0 0 3px; font-weight: 600; font-size: 12px; }
      .suggestion-why { margin: 0; font-size: 10px; line-height: 1.4; }
    </style>
  </head>
  <body>
    <div class="banner" id="unprotected" hidden>PROTECTION OFF — VISIBLE IN A SHARE</div>

    <header>
      <h1 id="engagement">…</h1>
      <div class="score"><span id="scoreValue">0</span><span> / 100</span></div>
    </header>

    <ul id="criteria" aria-live="polite"></ul>

    <!-- One suggestion, or nothing. Someone mid-conversation cannot read a
         list, and a stale suggestion is worse than none. -->
    <aside class="suggestion" id="suggestion" hidden>
      <p class="suggestion-ask" id="suggestionAsk"></p>
      <p class="suggestion-why muted" id="suggestionWhy"></p>
    </aside>

    <footer>
      <button id="listen">Listen</button>
      <button id="protection">Protection: on</button>
      <button id="clickthrough">Click-through: off</button>
      <span class="muted" id="status">idle</span>
      <!-- Whether the call is being kept. Deliberately its own line rather
           than folded into the status: the score and the saving fail
           independently, and one reading fine says nothing about the other. -->
      <span class="muted keeping" id="keeping"></span>
    </footer>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
