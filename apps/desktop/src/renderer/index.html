<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tesserafy</title>
    <style>
      /*
       * The overlay is read out of the corner of an eye during a conversation
       * someone is having. That is the whole design constraint:
       *
       *   - glanceable in under a second, so state is a mark and a weight as
       *     well as a colour;
       *   - quiet, so nothing animates and nothing is brighter than it needs
       *     to be — a scorecard that pulls attention off the customer costs
       *     more than it gives;
       *   - legible over anything, since it floats over whatever is on screen.
       */
      :root { color-scheme: dark; font: 13px/1.5 system-ui, sans-serif; }

      /*
       * The seller's choice of look (Appearance, in the footer), as variables.
       * Themes change the panel and its text; the state colours change only
       * as far as each theme needs for contrast, and keep their meaning.
       * --alpha fades the background and nothing else: text stays solid.
       */
      :root, :root[data-theme="dark"] {
        --bg: 12, 10, 9; --line: 120, 113, 108; --field: rgba(28, 25, 23, 0.9);
        --text: #f5f5f4; --text-2: #e7e5e4; --button-text: #d6d3d1;
        --dim: #a8a29e; --muted: #78716c; --faint: #57534e;
        --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
        --accent-rgb: var(--accent-hi);
        --alpha: 0.88;
      }
      :root[data-theme="midnight"] {
        --bg: 15, 23, 42; --line: 100, 116, 139; --field: rgba(30, 41, 59, 0.9);
        --text: #f1f5f9; --text-2: #e2e8f0; --button-text: #cbd5e1;
        --dim: #94a3b8; --muted: #8391a7; --faint: #64748b;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: 250, 250, 249; --line: 120, 113, 108; --field: rgba(255, 255, 255, 0.95);
        --text: #1c1917; --text-2: #292524; --button-text: #44403c;
        --dim: #57534e; --muted: #6b645f; --faint: #a8a29e;
        --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
        --accent-rgb: var(--accent-lo);
      }
      /* Each accent in a light tint for dark themes and a deep one for light.
         None is green, amber or red: those are taken. */
      :root, :root[data-accent="indigo"] { --accent-hi: 165, 180, 252; --accent-lo: 67, 56, 202; }
      :root[data-accent="sky"] { --accent-hi: 125, 211, 252; --accent-lo: 3, 105, 161; }
      :root[data-accent="violet"] { --accent-hi: 196, 181, 253; --accent-lo: 109, 40, 217; }
      :root[data-accent="stone"] { --accent-hi: 214, 211, 209; --accent-lo: 68, 64, 60; }

      /* The card is its own element, not the body: a body background spreads
         to the whole window, which painted a tinted rectangle over the
         meeting below a card that ends well short of the window's bottom. */
      html, body { margin: 0; background: transparent; }
      .card {
        padding: 12px 14px;
        color: var(--text);
        background: rgba(var(--bg), var(--alpha));
        backdrop-filter: blur(8px);
        border: 1px solid rgba(var(--line), 0.35);
        border-radius: 12px;
        -webkit-app-region: drag;
        user-select: none;
      }

      header { display: flex; justify-content: space-between; align-items: baseline; }
      h1 { font-size: 11px; margin: 0; font-weight: 600; letter-spacing: 0.08em;
           text-transform: uppercase; color: var(--dim); }
      .score { font-size: 28px; font-weight: 700; line-height: 1; color: rgb(var(--accent-rgb)); }
      .score span { font-size: 11px; font-weight: 400; color: var(--muted); }
      .score #scoreValue { font-size: inherit; font-weight: inherit; color: inherit; }

      ul { list-style: none; margin: 10px 0 0; padding: 0; }
      li { display: flex; justify-content: space-between; align-items: baseline;
           gap: 10px; padding: 5px 0; }
      li + li { border-top: 1px solid rgba(var(--line), 0.18); }
      .label { color: var(--text-2); }

      /* State is never colour alone: peripheral vision reads shape and weight
         long before it reads hue. */
      .state { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
      .state::before { margin-right: 5px; }
      .state.confirmed { color: var(--ok); font-weight: 700; }
      .state.confirmed::before { content: "●"; }
      .state.candidate { color: var(--warn); }
      .state.candidate::before { content: "◐"; }
      .state.contradicted { color: var(--bad); font-weight: 700; }
      .state.contradicted::before { content: "✕"; }
      .state.unobserved::before { content: "○"; }

      footer { margin-top: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      button, input { -webkit-app-region: no-drag; }
      button { font: inherit; font-size: 11px; color: var(--button-text);
               background: transparent; border: 1px solid rgba(var(--line), 0.35);
               border-radius: 6px; padding: 3px 7px; cursor: pointer; }
      button:hover { border-color: var(--dim); }
      button:disabled { opacity: 0.45; cursor: default; }
      button[aria-pressed="true"] { color: var(--text); border-color: rgb(var(--accent-rgb));
                                    background: rgba(var(--accent-rgb), 0.14); }
      .consent { -webkit-app-region: no-drag; display: flex; gap: 6px; align-items: flex-start;
                 margin-top: 12px; font-size: 10px; color: var(--dim); cursor: pointer; }
      .consent input { margin: 1px 0 0; }
      .muted { color: var(--muted); font-size: 10px; }
      /* How close a criterion is, in the smallest thing that can say it. */
      .hint { color: var(--faint); font-size: 9px; margin-right: 6px;
              font-variant-numeric: tabular-nums; }
      /* Pushed to its own end of the footer so it reads as a separate fact
         from the score, which is what it is. */
      .keeping { margin-left: auto; }

      /* Loud on purpose, and only when protection is off: this is the one
         state where the overlay is a liability rather than a tool. */
      .banner { background: #f97316; color: #0c0a09; font-weight: 700; padding: 5px 7px;
                border-radius: 6px; margin-bottom: 10px; font-size: 10px;
                letter-spacing: 0.04em; }
      .banner[hidden] { display: none; }

      .suggestion { margin-top: 10px; padding: 8px 10px; border-radius: 8px;
                    border: 1px solid rgba(var(--accent-rgb), 0.5);
                    background: rgba(var(--accent-lo), 0.18); }
      .suggestion[hidden] { display: none; }
      .suggestion-ask { margin: 0 0 3px; font-weight: 600; font-size: 12px; }
      .suggestion-why { margin: 0; font-size: 10px; line-height: 1.4; }

      /* Signing in. Inputs must opt out of the window drag, or clicking one
         drags the overlay instead of focusing the field. */
      .signin { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
      .signin[hidden] { display: none; }
      .signin input { font: inherit; font-size: 12px; color: var(--text);
                      background: var(--field); border: 1px solid rgba(var(--line), 0.45);
                      border-radius: 6px; padding: 6px 8px; user-select: text; }
      .signin .error { color: var(--bad); font-size: 11px; margin: 0; }
      .signin .error:empty { display: none; }
      .who { font-size: 10px; color: var(--dim); margin-top: 8px; display: flex; gap: 6px; align-items: center; }
      .who[hidden] { display: none; }

      /* Appearance. Takes the scorecard's place while open, so the window
         does not grow; the score stays in view to show the accent. */
      .look { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
      .look[hidden] { display: none; }
      .look-row { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 8px; }
      .look-row > span, .look-row > label { font-size: 10px; color: var(--dim);
                                             letter-spacing: 0.04em; text-transform: uppercase; }
      .choices { display: flex; gap: 4px; flex-wrap: wrap; }
      .corners { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
      .swatch { width: 22px; height: 22px; padding: 0; border-radius: 50%; }
      .swatch::after { content: ""; display: block; width: 12px; height: 12px; margin: auto;
                       border-radius: 50%; background: rgb(var(--swatch)); }
      .swatch[data-accent-choice="indigo"] { --swatch: 129, 140, 248; }
      .swatch[data-accent-choice="sky"] { --swatch: 56, 189, 248; }
      .swatch[data-accent-choice="violet"] { --swatch: 167, 139, 250; }
      .swatch[data-accent-choice="stone"] { --swatch: 168, 162, 158; }
      .opacity { display: flex; align-items: center; gap: 8px; }
      .opacity input { flex: 1; accent-color: rgb(var(--accent-rgb)); }
      .opacity output { font-size: 10px; color: var(--dim); width: 32px; text-align: right;
                        font-variant-numeric: tabular-nums; }
      .look-actions { display: flex; gap: 6px; justify-content: flex-end; }
      body.looking #criteria, body.looking #suggestion, body.looking .signin,
      body.looking .who, body.looking .consent { display: none; }
    </style>
  </head>
  <body>
    <div class="card">
    <div class="banner" id="unprotected" hidden>PROTECTION OFF — VISIBLE IN A SHARE</div>

    <header>
      <h1 id="engagement">…</h1>
      <div class="score"><span id="scoreValue">0</span><span> / 100</span></div>
    </header>

    <ul id="criteria" aria-live="polite"></ul>

    <!-- How the overlay looks and where it sits: saved on this computer only.
         Every choice applies as it is made; there is nothing to save. -->
    <section class="look" id="look" aria-label="Appearance" hidden>
      <div class="look-row">
        <span>Theme</span>
        <div class="choices">
          <button type="button" data-theme-choice="dark">Dark</button>
          <button type="button" data-theme-choice="midnight">Midnight</button>
          <button type="button" data-theme-choice="light">Light</button>
        </div>
      </div>
      <div class="look-row">
        <span>Accent</span>
        <div class="choices">
          <button type="button" class="swatch" data-accent-choice="indigo" aria-label="Indigo" title="Indigo"></button>
          <button type="button" class="swatch" data-accent-choice="sky" aria-label="Sky" title="Sky"></button>
          <button type="button" class="swatch" data-accent-choice="violet" aria-label="Violet" title="Violet"></button>
          <button type="button" class="swatch" data-accent-choice="stone" aria-label="Neutral" title="Neutral"></button>
        </div>
      </div>
      <div class="look-row">
        <label for="opacity">Background</label>
        <div class="opacity">
          <input type="range" id="opacity" min="35" max="100" step="5" />
          <output id="opacityValue" for="opacity"></output>
        </div>
      </div>
      <div class="look-row">
        <span>Size</span>
        <div class="choices">
          <button type="button" data-size-choice="small">Small</button>
          <button type="button" data-size-choice="normal">Normal</button>
          <button type="button" data-size-choice="large">Large</button>
        </div>
      </div>
      <div class="look-row">
        <span>Position</span>
        <div class="corners">
          <button type="button" data-corner-choice="top-left">↖ Top left</button>
          <button type="button" data-corner-choice="top-right">↗ Top right</button>
          <button type="button" data-corner-choice="bottom-left">↙ Bottom left</button>
          <button type="button" data-corner-choice="bottom-right">↘ Bottom right</button>
        </div>
      </div>
      <p class="muted" style="margin: 0">
        Or drag the overlay anywhere; it opens there next time. The text stays solid at any
        background. Saved on this computer only.
      </p>
      <div class="look-actions">
        <button type="button" id="lookReset">Reset</button>
        <button type="button" id="lookDone">Done</button>
      </div>
    </section>

    <!-- One suggestion, or nothing. Someone mid-conversation cannot read a
         list, and a stale suggestion is worse than none. -->
    <aside class="suggestion" id="suggestion" hidden>
      <p class="suggestion-ask" id="suggestionAsk"></p>
      <p class="suggestion-why muted" id="suggestionWhy"></p>
    </aside>

    <!-- The same account as the web app. The password goes to the main
         process once and is not kept; the page is told who, never a token. -->
    <form class="signin" id="signin" hidden>
      <input id="identifier" autocomplete="username" placeholder="Username or email" required />
      <input id="password" type="password" autocomplete="current-password" placeholder="Password" required />
      <button type="submit" id="signinButton">Sign in</button>
      <p class="error" id="signinError" role="alert"></p>
      <p class="muted" id="remembers"></p>
    </form>

    <div class="who" id="who" hidden>
      <span id="whoEmail"></span>
      <button type="button" id="signout">Sign out</button>
    </div>

    <!-- Asked before the first word: listening starts the recording. The
         sentence is the one the server stores with the call, word for word;
         the overlay only says it was ticked. -->
    <label class="consent">
      <input type="checkbox" id="consent" />
      <span>Everyone on this call has been told it is being recorded, transcribed and analysed, and has agreed to it.</span>
    </label>

    <footer>
      <button id="listen" disabled>Listen</button>
      <button id="protection">Protection: on</button>
      <button id="clickthrough">Click-through: off</button>
      <button id="lookOpen" aria-expanded="false" aria-controls="look">Appearance</button>
      <span class="muted" id="status">idle</span>
      <!-- Whether the call is being kept. Deliberately its own line rather
           than folded into the status: the score and the saving fail
           independently, and one reading fine says nothing about the other. -->
      <span class="muted keeping" id="keeping"></span>
    </footer>
    </div>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
